version: 2

# Actualizaciones semanales de dependencias. Los parches y cambios menores se
# agrupan para reducir ruido; los cambios major llegan en PRs individuales.
# Las alertas y las actualizaciones de seguridad están activadas en el repo.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencias
    ignore:
      # @types/node sigue la major de Node; el runtime es Node 24 (.nvmrc).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript 7 todavía no está soportado por typescript-eslint 8.x.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      # Vite 8 exige @vitejs/plugin-react 6; se actualizarán juntos.
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
      # @eslint/js debe ir a la par que eslint; se subirán juntos a la 10.
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
    groups:
      produccion:
        dependency-type: production
        update-types:
          - minor
          - patch
      desarrollo:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencias
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
