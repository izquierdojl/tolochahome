name: cleanup

# Borra únicamente versiones de GHCR cuyos tags sean todos `pr-*` y tengan
# más de 7 días. No toca :latest, :vX.Y.Z, :vX.Y ni :node<ver>.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar qué se borraría"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-pr-tags
  cancel-in-progress: false

jobs:
  pr-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar tags pr-* antiguos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '7 days ago' +%s)"
          # shellcheck disable=SC2016 # $tags es una variable de jq, no de shell.
          gh api --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | select((.metadata.container.tags // []) as $tags | ($tags | length) > 0 and all($tags[]; startswith("pr-"))) | [.id, (.metadata.container.tags | join(",")), .updated_at] | @tsv' |
          while IFS=$'\t' read -r id tags updated; do
            [[ -z "${id:-}" ]] && continue
            UPDATED_TS="$(date -u -d "$updated" +%s)"
            if (( UPDATED_TS >= CUTOFF )); then
              echo "Conservar $tags ($updated)"
              continue
            fi
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Dry-run: borraría $tags (id=$id)"
            else
              echo "Borrando $tags (id=$id)"
              gh api --method DELETE \
                "/users/${OWNER}/packages/container/${PACKAGE}/versions/${id}"
            fi
          done
