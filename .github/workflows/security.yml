name: security

# Escaneo diario de la imagen publicada. El release ya escanea la imagen
# definitiva antes de publicarla; esto cubre CVEs nuevas en :latest.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/security.yml"

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: security-latest
  cancel-in-progress: false

jobs:
  trivy:
    name: Escanear imagen :latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Subir resultados a code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-imagen
