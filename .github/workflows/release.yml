name: release

# Publica la imagen en GHCR solo con push o PR a main (nada de builds desde dev):
# - Push a main (merge dev→main) → :latest, :vX.Y.Z y :vX.Y (versión de package.json).
# - PR a main → :pr-<n>, para probar la imagen antes de fusionar.
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Un PR desde un fork no tiene permisos de paquetes: solo se publica si viene del mismo repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "list=${BASE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            V="$(jq -r .version package.json)"
            echo "list=${BASE}:latest,${BASE}:v${V},${BASE}:v${V%.*}" >> "$GITHUB_OUTPUT"
          fi
          echo "Tags: $(grep '^list=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
