name: release-node

# Rebuild programado de la imagen cuando cambia el parche de Node 24.x.
# El release normal (código + versión + imagen) vive en ci.yml y solo se
# ejecuta en push a main, después de que `quality` haya pasado.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruir aunque la versión de Node ya esté al día"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: release-node
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_MAJOR: "24"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.compare.outputs.needed }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Comparar Node de :latest con el último 24.x
        id: compare
        run: |
          TARGET="$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r --arg major "v${NODE_MAJOR}." \
              '[.[] | select(.version | startswith($major))][0].version' \
            | sed 's/^v//')"
          if [[ -z "$TARGET" || "$TARGET" == "null" ]]; then
            echo "::error::No se pudo obtener la última versión de Node ${NODE_MAJOR}.x"
            exit 1
          fi
          IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"
          CURRENT=""
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            CURRENT="$(docker run --rm --entrypoint node "$IMAGE" -v 2>/dev/null | sed 's/^v//' || true)"
          fi
          echo "Node en :latest = ${CURRENT:-desconocido}; último ${NODE_MAJOR}.x = ${TARGET}"
          NEEDED=true
          if [[ "$CURRENT" == "$TARGET" && "${{ inputs.force }}" != "true" ]]; then
            NEEDED=false
          fi
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: always() && !cancelled() && needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tolochahome:node-release
          build-args: |
            NODE_VERSION=${{ needs.check.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test en contenedor
        run: |
          set -euo pipefail
          docker run -d --name tolochahome-node-smoke \
            -e JWT_ACCESS_SECRET="smoke-access-secret-0123456789abcd" \
            -e JWT_REFRESH_SECRET="smoke-refresh-secret-9876543210wxyz" \
            -p 127.0.0.1:3100:3000 tolochahome:node-release
          cleanup() { docker rm -f tolochahome-node-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3100/api/v1/health; then
            docker logs tolochahome-node-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:3100/ | grep -qiE "TolochaHome|tolochahome|<!doctype html"
      - name: Escanear imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tolochahome:node-release
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Publicar :latest y :node<ver>
        env:
          NODE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          BASE="${REGISTRY}/${IMAGE_NAME}"
          for tag in "$BASE:latest" "$BASE:node$NODE_VERSION"; do
            docker tag tolochahome:node-release "$tag"
            docker push "$tag"
          done
          echo "Imagen actualizada con Node $NODE_VERSION"
