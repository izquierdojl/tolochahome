name: release

# - Tag v* empujado a mano → publica :vX.Y.Z y :dev.
# - version.yml (tras bump automático) lo dispara vía workflow_dispatch,
#   porque los push con GITHUB_TOKEN no lanzan workflows.
# - Push a main (promoción dev→main) → publica :latest.
on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag vX.Y.Z a publicar"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - id: tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=""
          fi
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "list=${BASE}:latest" >> "$GITHUB_OUTPUT"
          else
            V="${TAG#v}"
            echo "list=${BASE}:${V},${BASE}:${V%.*},${BASE}:dev" >> "$GITHUB_OUTPUT"
          fi
          echo "Tags: $(grep '^list=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
