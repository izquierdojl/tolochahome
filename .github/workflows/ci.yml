name: ci

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read
  pull-requests: read

# Cancela ejecuciones antiguas del mismo PR o rama. En main nunca se cancela:
# el release por tag consulta el CI del commit exacto.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Valida OpenSpec y decide qué trabajos hacen falta.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!openspec/**"
              - "!.opencode/**"
              - "!**/*.md"
              - "!LICENSE"
              - "!.gitignore"
            docker:
              - "Dockerfile"
              - "docker-entrypoint.sh"
              - ".dockerignore"
              - "package.json"
              - "package-lock.json"
              - "tsconfig*.json"
              - "apps/*/package.json"
              - "apps/*/tsconfig*.json"
              - "apps/api/drizzle/**"
              - "apps/web/vite.config.*"
              - "apps/api/vite.config.*"
      - name: Validar changes OpenSpec
        run: bash scripts/check_changes.sh

  quality:
    needs: changes
    # En un PR dev→main el mismo SHA ya se validó en el push a dev. El merge a
    # main se vuelve a validar y el release por tag exige `quality` en verde.
    if: |
      needs.changes.outputs.code == 'true' &&
      !(github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck, lint, tests y build
        run: npm run verify

  # La imagen solo se valida en PRs que tocan el Dockerfile o el lockfile.
  # El release por tag construye, escanea y prueba la imagen definitiva.
  docker:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tolochahome:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test en contenedor
        run: |
          set -euo pipefail
          docker run -d --name tolochahome-smoke \
            -e JWT_ACCESS_SECRET="smoke-access-secret-0123456789abcd" \
            -e JWT_REFRESH_SECRET="smoke-refresh-secret-9876543210wxyz" \
            -p 127.0.0.1:3100:3000 tolochahome:test
          cleanup() { docker rm -f tolochahome-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3100/api/v1/health; then
            docker logs tolochahome-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:3100/ | grep -qiE "TolochaHome|tolochahome|<!doctype html"

  # Check estable para el ruleset main-ci: éxito si no hay ningún job fallido.
  ci-ok:
    needs: [changes, quality, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          echo "changes=$CHANGES quality=$QUALITY docker=$DOCKER"
          for result in "$CHANGES" "$QUALITY" "$DOCKER"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::Un job necesario terminó en $result"
              exit 1
            fi
          done
