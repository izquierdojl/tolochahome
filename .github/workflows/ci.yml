name: ci

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar changes OpenSpec
        run: bash scripts/check_changes.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint --workspaces --if-present
      - run: npm test --workspace @tolochahome/api --if-present
      - run: npm run build
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/api/dist
            apps/web/dist
          retention-days: 7

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tolochahome:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test en contenedor
        run: |
          docker run -d --name tolochahome-smoke \
            -e JWT_ACCESS_SECRET="smoke-access-secret-0123456789abcd" \
            -e JWT_REFRESH_SECRET="smoke-refresh-secret-9876543210wxyz" \
            -p 127.0.0.1:3100:3000 tolochahome:test
          sleep 3
          docker ps -a
          echo "--- logs del arranque ---"
          docker logs tolochahome-smoke
          echo "--- probando health ---"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/api/v1/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:3100/api/v1/health
          curl -fsS http://127.0.0.1:3100/ | grep -qi "TolochaHome\|tolochahome\|<!doctype html"
          docker stop tolochahome-smoke
